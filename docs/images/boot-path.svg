<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="ui-sans-serif,system-ui,sans-serif">
  <rect width="960" height="320" fill="#0d1117"/>
  <text x="480" y="40" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Kernel boot path</text>

  <!-- boxes -->
  <rect x="30" y="90" width="130" height="60" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="95" y="125" text-anchor="middle" fill="#e6edf3" font-size="13">BIOS / QEMU</text>

  <rect x="190" y="90" width="130" height="60" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="255" y="125" text-anchor="middle" fill="#e6edf3" font-size="13">Multiboot2</text>

  <rect x="350" y="90" width="130" height="60" rx="10" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
  <text x="415" y="118" text-anchor="middle" fill="#e6edf3" font-size="12">boot.S</text>
  <text x="415" y="136" text-anchor="middle" fill="#8b949e" font-size="11">± long mode</text>

  <rect x="510" y="90" width="140" height="60" rx="10" fill="#21262d" stroke="#e94560" stroke-width="2"/>
  <text x="580" y="125" text-anchor="middle" fill="#e6edf3" font-size="13">kernel_main</text>

  <rect x="680" y="90" width="120" height="60" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="740" y="118" text-anchor="middle" fill="#e6edf3" font-size="12">VGA seals</text>
  <text x="740" y="136" text-anchor="middle" fill="#8b949e" font-size="11">mmap print</text>

  <rect x="830" y="90" width="100" height="60" rx="10" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
  <text x="880" y="125" text-anchor="middle" fill="#e6edf3" font-size="13">hlt</text>

  <!-- arrows -->
  <path d="M160 120 H190" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>
  <path d="M320 120 H350" stroke="#484f58" stroke-width="2"/>
  <path d="M480 120 H510" stroke="#484f58" stroke-width="2"/>
  <path d="M650 120 H680" stroke="#484f58" stroke-width="2"/>
  <path d="M800 120 H830" stroke="#484f58" stroke-width="2"/>

  <text x="480" y="200" text-anchor="middle" fill="#8b949e" font-size="13">32-bit: direct entry · 64-bit: page tables, GDT, EFER.LME, far jump</text>
  <text x="480" y="230" text-anchor="middle" fill="#e94560" font-size="13">[SEAL] sovereign_kernel_boot</text>
  <text x="480" y="258" text-anchor="middle" fill="#8b949e" font-size="13">memory map lines (addr · len · type)</text>
  <text x="480" y="286" text-anchor="middle" fill="#3fb950" font-size="13">[SEAL] sovereign_kernel_ready  →  pure halt</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#484f58"/>
    </marker>
  </defs>
</svg>
