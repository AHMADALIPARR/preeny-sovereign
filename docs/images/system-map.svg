<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">Sovereign OS</text>
  <text x="480" y="76" text-anchor="middle" fill="#8b949e" font-size="14">pure · deterministic · freestanding</text>

  <!-- Layer cards -->
  <rect x="48" y="110" width="200" height="100" rx="12" fill="#21262d" stroke="#e94560" stroke-width="2" filter="url(#glow)"/>
  <text x="148" y="148" text-anchor="middle" fill="#e94560" font-size="13" font-weight="700">LAYER 1</text>
  <text x="148" y="172" text-anchor="middle" fill="#e6edf3" font-size="16">Pure C stubs</text>
  <text x="148" y="194" text-anchor="middle" fill="#8b949e" font-size="12">src/*.so · LD_PRELOAD</text>

  <rect x="268" y="110" width="200" height="100" rx="12" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="368" y="148" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">LAYER 2</text>
  <text x="368" y="172" text-anchor="middle" fill="#e6edf3" font-size="16">Fortran kernels</text>
  <text x="368" y="194" text-anchor="middle" fill="#8b949e" font-size="12">BIND(C) · pure math</text>

  <rect x="488" y="110" width="200" height="100" rx="12" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
  <text x="588" y="148" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="700">LAYER 3</text>
  <text x="588" y="172" text-anchor="middle" fill="#e6edf3" font-size="16">Userspace init</text>
  <text x="588" y="194" text-anchor="middle" fill="#8b949e" font-size="12">os/init · seals</text>

  <rect x="708" y="110" width="200" height="100" rx="12" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="808" y="148" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">LAYER 4</text>
  <text x="808" y="172" text-anchor="middle" fill="#e6edf3" font-size="16">Boot kernels</text>
  <text x="808" y="194" text-anchor="middle" fill="#8b949e" font-size="12">32-bit · 64-bit · hlt</text>

  <!-- connectors -->
  <path d="M248 160 H268" stroke="#484f58" stroke-width="2"/>
  <path d="M468 160 H488" stroke="#484f58" stroke-width="2"/>
  <path d="M688 160 H708" stroke="#484f58" stroke-width="2"/>

  <!-- Boot panel -->
  <rect x="48" y="250" width="420" height="250" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="258" y="286" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">Boot path</text>
  <text x="72" y="320" fill="#8b949e" font-size="13">1  Multiboot2 entry (boot.S)</text>
  <text x="72" y="348" fill="#8b949e" font-size="13">2  Long-mode switch (64-bit only)</text>
  <text x="72" y="376" fill="#8b949e" font-size="13">3  kernel_main — clear VGA</text>
  <text x="72" y="404" fill="#e94560" font-size="13">4  [SEAL] sovereign_kernel_boot</text>
  <text x="72" y="432" fill="#8b949e" font-size="13">5  Parse mmap tag type 6</text>
  <text x="72" y="460" fill="#3fb950" font-size="13">6  [SEAL] ready  then  for(;;) hlt</text>

  <!-- Contract panel -->
  <rect x="492" y="250" width="416" height="250" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="700" y="286" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">Determinism contract</text>
  <text x="516" y="324" fill="#e94560" font-size="14">time / gettimeofday  →  0</text>
  <text x="516" y="352" fill="#e94560" font-size="14">rand / random  →  42</text>
  <text x="516" y="380" fill="#e94560" font-size="14">fork / alarm / sleep  →  0</text>
  <text x="516" y="408" fill="#e94560" font-size="14">getuid / geteuid  →  0</text>
  <text x="516" y="448" fill="#3fb950" font-size="14">no heap · no libc · VGA only · sealed</text>
</svg>
